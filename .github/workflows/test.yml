name: test
on:
  push:
  pull_request:
  schedule:
    - cron: "23 9 * * 1"   # weekly: catch a grail change that breaks this userland
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: python -m pytest -q

  install-line:
    # Install from GitHub on clean machines with no Brainstem, serve the examples, call one tool.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: python -m pip install -r requirements.txt
      - run: python tests/install/readme_line.py ${{ github.sha }}
